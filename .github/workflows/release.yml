name: release

on:
  push:
    tags:
      - "*@*"

permissions:
  contents: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve target plugin and version
        id: meta
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          slug="${tag%@*}"
          version="${tag#*@}"

          if [ ! -f "plugins/${slug}/plugin.json" ]; then
            echo "missing plugins/${slug}/plugin.json" >&2
            exit 1
          fi

          expected="$(node -p "require('./plugins/${slug}/plugin.json').version")"
          if [ "${expected}" != "${version}" ]; then
            echo "tag ${tag} does not match plugins/${slug}/plugin.json version ${expected}" >&2
            exit 1
          fi

          echo "slug=${slug}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        run: |
          set -euo pipefail
          slug="${{ steps.meta.outputs.slug }}"

          echo "Building plugin ${slug}..."
          cd "plugins/${slug}"
          npm ci || npm install
          npm run build
          cd ../..

      - name: Package bundle and update registry
        id: bundle
        run: |
          set -euo pipefail
          slug="${{ steps.meta.outputs.slug }}"

          node scripts/bundle.mjs "${slug}" --update-registry
          node scripts/validate-registry.mjs

          echo "archive=${slug}-bundle.zip" >> "$GITHUB_OUTPUT"

      - name: Commit and push updated registry.json
        run: |
          set -euo pipefail
          slug="${{ steps.meta.outputs.slug }}"
          version="${{ steps.meta.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout main
          git pull --rebase origin main

          git add registry.json
          if ! git diff-index --quiet HEAD --; then
            git commit -m "chore(registry): update ${slug} to ${version}"
            git push origin main
          else
            echo "registry.json is already up to date"
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag="${{ steps.meta.outputs.tag }}"
          slug="${{ steps.meta.outputs.slug }}"
          version="${{ steps.meta.outputs.version }}"
          archive="${{ steps.bundle.outputs.archive }}"

          gh release create "${tag}" "${archive}" \
            --title "${slug} ${version}" \
            --notes "Source: https://github.com/${GITHUB_REPOSITORY}/tree/${tag}" || \
          gh release upload "${tag}" "${archive}" --clobber
